<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea,.grid select{width:90%}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><pre id="state"></pre></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><section><h2>离线回传与合并</h2><div class="grid"><input id="devnum" placeholder="设备号 (如 DEV-001)"><input id="devname" placeholder="设备名称"><button onclick="regDevice()">注册设备</button></div><div class="grid"><input id="odev" type="number" placeholder="设备 ID"><input id="ocont" type="number" placeholder="连续编号"><input id="obase" type="number" placeholder="镜头版本基准"><select id="otype"><option value="shot_state">镜头状态</option><option value="exemption">冲突豁免</option></select><input id="oshot" type="number" placeholder="镜头 ID (状态)"><input id="oelement" type="number" placeholder="元素 ID (状态)"><input id="ostate" placeholder="状态值"><input id="onumeric" type="number" step="0.1" placeholder="数值"><input id="oconflict" type="number" placeholder="冲突 ID (豁免)"><input id="oreason" placeholder="理由"><input id="ouser" type="number" placeholder="回传人 ID"></div><button onclick="upload()">回传并合并</button><button onclick="mergeDev()">合并该设备</button><button onclick="resumeAll()">续传全部</button><button onclick="summary()">刷新进度</button><pre id="offline"></pre></section><section><h2>离线合并进度</h2><pre id="progress"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
function report(){get('/api/productions/'+production.value+'/continuity','#state')}
function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value})}
function check(){post('/api/scenes/'+scene.value+'/check',{})}
function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}
function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}
function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}
function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}
function regDevice(){post('/api/devices',{device_number:devnum.value,name:devname.value},'#offline')}
function upload(){const payload=otype.value==='shot_state'?{shot_id:+oshot.value,element_id:+oelement.value,state_value:ostate.value,numeric_value:onumeric.value?+onumeric.value:null,note:oreason.value,user_id:+ouser.value}:{conflict_id:+oconflict.value,reason:oreason.value,user_id:+ouser.value};post('/api/devices/'+odev.value+'/records',{continuity_number:+ocont.value,record_type:otype.value,payload:payload,base_shot_version:+obase.value},'#offline')}
function mergeDev(){post('/api/devices/'+odev.value+'/merge',{},'#offline')}
function resumeAll(){post('/api/offline/resume',{},'#offline')}
function summary(){get('/api/offline/summary','#progress')}
report();summary()</script></html>
